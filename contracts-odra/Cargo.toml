[package]
name = "karma-odra"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "KARMA AgentSkillRegistry — Odra port for Casper Network (Casper Agentic Buildathon T9)."

[lib]
crate-type = ["rlib"]

[dependencies]
# Pin EXACT version (=2.8.1) to prevent silent Odra-macros churn between local builds and CI
# (the risk register flagged this as Odra version churn — mitigation: pin in Cargo.toml).
# Bump deliberately; do not relax to a caret range.
odra = { version = "=2.8.1", default-features = false }
odra-build = "=2.8.1"

[dev-dependencies]
odra-test = "=2.8.1"

# `cargo odra build` (WASM compilation for Casper deployment): see
# `contracts-odra/README.md` § "wasm32 build — known blocker" for the exact remaining gap.
# `bin/build_contract.rs` / `bin/build_schema.rs` are kept as reference-only recipes (excluded
# from the default build/test graph below) until that's resolved — see the README section for why
# they can't just be wired up as `[[bin]]` targets.

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
