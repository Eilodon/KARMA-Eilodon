[package]
name = "reputation_aggregation_verifier"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban verifier contract for KARMA ReputationAggregationProof (Stellar ZK track, T1.1)."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# `testutils` pulls in the host-side Soroban env so `cargo test` works on x86. The contract WASM
# build (cargo build --release --target wasm32-unknown-unknown) leaves this OFF.
testutils = ["soroban-sdk/testutils"]

[dependencies]
# Groth16 pairing check runs entirely on Stellar's native BN254 host functions
# (env.crypto().bn254(), CAP-0074 bn254_multi_pairing_check — Protocol 25). No Arkworks
# dependency, no heap allocator. Same toolchain as agent_credential_verifier (T5); keeping
# the two verifiers separate keeps audit + nullifier domains disjoint while reusing the
# same native crypto path. See docs/decisions/DP-7.
soroban-sdk = "26.0.0"

[dev-dependencies]
soroban-sdk = { version = "26.0.0", features = ["testutils"] }

[profile.release]
opt-level    = "z"
overflow-checks = true
debug        = 0
strip        = "symbols"
debug-assertions = false
panic        = "abort"
codegen-units = 1
lto          = true
