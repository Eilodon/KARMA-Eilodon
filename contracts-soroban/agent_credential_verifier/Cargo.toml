[package]
name = "agent_credential_verifier"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban verifier contract for KARMA AgentCredentialProof (Stellar ZK track, T5)."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# `testutils` pulls in the host-side Soroban env so `cargo test` works on x86. The contract WASM
# build (cargo build --release --target wasm32-unknown-unknown) leaves this OFF.
testutils = ["soroban-sdk/testutils"]

[dependencies]
# Groth16 pairing check runs entirely on Stellar's native BN254 host functions
# (env.crypto().bn254(), CAP-0074 bn254_multi_pairing_check — Protocol 25). No Arkworks
# dependency, no heap allocator: the host does the elliptic-curve arithmetic, the contract
# just wires bytes + call order together. See docs/decisions/DP-7 for why this replaced
# the earlier ark-bn254/ark-groth16 software verifier.
soroban-sdk = "26.0.0"

[dev-dependencies]
soroban-sdk = { version = "26.0.0", features = ["testutils"] }

[profile.release]
opt-level    = "z"
overflow-checks = true
debug        = 0
strip        = "symbols"
debug-assertions = false
panic        = "abort"
codegen-units = 1
lto          = true
